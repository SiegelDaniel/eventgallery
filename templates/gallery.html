{% extends "base.html" %}
{% block title %}Gallery · Event Gallery{% endblock %}
{% block content %}
<section>
  <div class="gallery-head">
    <h1>Gallery <span class="muted">({{ images|length }})</span></h1>
    {% if images %}
    <div class="bulk">
      <button type="button" class="btn" id="selectAll">Select all</button>
      <button type="submit" form="galleryForm" formaction="{{ url_for('download') }}" class="btn primary">Download zip</button>
      <button type="submit" form="galleryForm" formaction="{{ url_for('delete') }}" class="btn danger"
              onclick="return confirm('Delete the selected photos? This cannot be undone.');">Delete</button>
    </div>
    {% endif %}
  </div>

  {% if not images %}
    <p class="muted">No photos yet. <a href="{{ url_for('index') }}">Upload some</a>.</p>
  {% else %}
    <form id="galleryForm" method="post">
      <div class="grid">
        {% for name in images %}
        <figure class="tile">
          {% if is_video(name) %}
          <video class="thumb" preload="metadata" muted playsinline
                 src="{{ url_for('image', name=name) }}#t=0.1"
                 data-full="{{ url_for('image', name=name) }}" data-video="1"></video>
          <span class="play-badge">▶</span>
          {% else %}
          <img class="thumb" loading="lazy"
               src="{{ url_for('thumb', name=name) }}"
               data-full="{{ url_for('image', name=name) }}"
               alt="{{ name }}">
          {% endif %}
          <label class="pick" title="Select">
            <input type="checkbox" name="selected" value="{{ name }}">
            <span class="check"></span>
          </label>
        </figure>
        {% endfor %}
      </div>
    </form>
  {% endif %}
</section>

<!-- Full-screen viewer -->
<div id="lightbox" class="lightbox" hidden>
  <button type="button" class="lb-close" aria-label="Close">✕</button>
  <div id="lightboxContent" class="lb-content"></div>
</div>

<script>
  // Selection toggle
  const selectAll = document.getElementById('selectAll');
  if (selectAll) {
    selectAll.addEventListener('click', () => {
      const boxes = document.querySelectorAll('input[name="selected"]');
      const anyUnchecked = Array.from(boxes).some(b => !b.checked);
      boxes.forEach(b => (b.checked = anyUnchecked));
      selectAll.textContent = anyUnchecked ? 'Deselect all' : 'Select all';
    });
  }

  // Click a photo/video to view it full size
  const lightbox = document.getElementById('lightbox');
  const lightboxContent = document.getElementById('lightboxContent');
  function closeLightbox() {
    lightbox.hidden = true;
    lightboxContent.innerHTML = '';   // stops any playing video
  }
  document.querySelectorAll('.thumb').forEach(el => {
    el.addEventListener('click', () => {
      if (el.dataset.video) {
        lightboxContent.innerHTML =
          `<video src="${el.dataset.full}" controls autoplay playsinline></video>`;
      } else {
        lightboxContent.innerHTML = `<img src="${el.dataset.full}" alt="">`;
      }
      lightbox.hidden = false;
    });
  });
  // Close when clicking the backdrop or ✕, but not when using the media/controls.
  lightbox.addEventListener('click', e => {
    if (e.target === lightbox || e.target.classList.contains('lb-close')) closeLightbox();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !lightbox.hidden) closeLightbox();
  });
</script>
{% endblock %}
